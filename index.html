<h1>BIP39 Mnemonic + Index Adder</h1>
<p>Takes a BIP39 mnemonic, interprets its entropy as an integer, adds the given index <em>I</em>, then emits a new valid mnemonic (checksum corrected). Supports 12/15/18/21/24-word English phrases.</p>

<label>Mnemonic phrase<br>
<textarea id="mnemonic" rows="4" placeholder="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"></textarea>
</label>

<label>Index I (integer, can be large)<br>
<input id="index" type="text" placeholder="1" value="1">
</label>

<button id="go">Compute new mnemonic</button>

const WORD_MAP = new Map(WORDLIST.map((w, i) => [w, i]));

async function sha256(data) {
  const hash = await crypto.subtle.digest('SHA-256', data);
  return new Uint8Array(hash);
}

function bytesToBigInt(bytes) {
  let n = 0n;
  for (const b of bytes) n = (n << 8n) | BigInt(b);
  return n;
}

function bigIntToBytes(n, length) {
  const bytes = new Uint8Array(length);
  for (let i = length - 1; i >= 0; i--) {
    bytes[i] = Number(n & 0xffn);
    n >>= 8n;
  }
  return bytes;
}

function mnemonicToEntropyBits(words) {
  const nWords = words.length;
  if (![12, 15, 18, 21, 24].includes(nWords)) {
    throw new Error('Mnemonic must be 12, 15, 18, 21 or 24 words');
  }
  let bits = 0n;
  for (const w of words) {
    const idx = WORD_MAP.get(w);
    if (idx === undefined) throw new Error(`Unknown word: ${w}`);
    bits = (bits << 11n) | BigInt(idx);
  }
  const totalBits = nWords * 11;
  const csBits = totalBits / 33; // because CS = ENT/32, total = ENT*33/32, so CS = total/33
  const entBits = totalBits - csBits;
  const mask = (1n << BigInt(entBits)) - 1n;
  const entropy = bits >> BigInt(csBits);
  // Optional: verify checksum
  // We'll recompute later; for now just extract
  return { entropy, entBits, csBits };
}

async function entropyToMnemonic(entropy, entBits) {
  const byteLen = entBits / 8;
  if (entBits % 8 !== 0) throw new Error('Entropy bit length must be multiple of 8');
  const entBytes = bigIntToBytes(entropy, byteLen);
  const hash = await sha256(entBytes);
  const csBits = entBits / 32;
  // Take first csBits of hash
  let cs = 0n;
  const fullBytes = Math.ceil(csBits / 8);
  for (let i = 0; i < fullBytes; i++) {
    cs = (cs << 8n) | BigInt(hash[i]);
  }
  cs >>= BigInt(8 * fullBytes - csBits); // keep only the top csBits
  const combined = (entropy << BigInt(csBits)) | cs;
  const totalBits = entBits + csBits;
  const nWords = totalBits / 11;
  const words = [];
  for (let i = nWords - 1; i >= 0; i--) {
    const shift = BigInt(i * 11);
    const idx = Number((combined >> shift) & 2047n);
    words.push(WORDLIST[idx]);
  }
  return words.join(' ');
}

document.getElementById('go').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.innerHTML = '';
  try {
    const phrase = document.getElementById('mnemonic').value.trim().toLowerCase().replace(/\s+/g, ' ');
    if (!phrase) throw new Error('Enter a mnemonic');
    const words = phrase.split(' ');
    const Istr = document.getElementById('index').value.trim();
    if (!/^-?\d+$/.test(Istr)) throw new Error('Index must be an integer');
    const I = BigInt(Istr);
    const { entropy, entBits } = mnemonicToEntropyBits(words);
    const mod = 1n << BigInt(entBits);
    const newEntropy = (entropy + I) % mod;
    // Handle negative I
    const adjusted = newEntropy < 0n ? newEntropy + mod : newEntropy;
    const newMnemonic = await entropyToMnemonic(adjusted, entBits);
    out.innerHTML = `<p class="success">New mnemonic:</p><pre>${newMnemonic}</pre><p>Entropy bits: ${entBits}</p>`;
  } catch (e) {
    out.innerHTML = `<p class="error">${e.message}</p>`;
  }
});
